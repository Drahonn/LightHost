name: Build

on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: LightHost
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  ACTIONS_RUNNER_FORCE_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_file: LightHost.exe
          - name: macOS
            os: macos-latest
            artifact_file: LightHost.dmg
          - name: Linux
            os: ubuntu-latest
            artifact_file: LightHost-Linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Environment Variables
        shell: bash
        run: |
          VERSION_REGEX='^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$'
          if [[ $GITHUB_REF =~ $VERSION_REGEX ]]; then
              PROJECT_VERSION="${BASH_REMATCH[1]}"
          else
              PROJECT_VERSION="0.0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "PROJECT_VERSION=${PROJECT_VERSION}" >> $GITHUB_ENV

      # --- Linux Setup ---
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libx11-dev \
            libxinerama-dev \
            libxext-dev \
            libfreetype6-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            ninja-build

      # --- macOS Setup ---
      - name: Set up Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja

      # --- Windows Setup ---
      - name: Set up MSVC environment on Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja on Windows
        if: runner.os == 'Windows'
        run: choco install ninja

      # --- Build ---
      - name: CMake Configure
        shell: bash
        run: cmake -B ${{ env.BUILD_DIR }} -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} .

      - name: CMake Build
        shell: bash
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      # --- Prepare Artifacts ---
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH=$(find "${{ env.BUILD_DIR }}" -name "${{ env.PROJECT_NAME }}.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: ${{ env.PROJECT_NAME }}.app not found in ${{ env.BUILD_DIR }}"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          hdiutil create -volname "${{ env.PROJECT_NAME }}" -srcfolder "${{ env.PROJECT_NAME }}.app" -ov -format UDZO "${{ env.PROJECT_NAME }}.dmg"

      - name: Prepare Linux Executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BIN_PATH=$(find "${{ env.BUILD_DIR }}" -name "${{ env.PROJECT_NAME }}" -type f -perm -111 | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find "${{ env.BUILD_DIR }}" -name "${{ env.PROJECT_NAME }}" -type f | head -n 1)
          fi
          if [ -z "$BIN_PATH" ]; then
            echo "Error: ${{ env.PROJECT_NAME }} binary not found in ${{ env.BUILD_DIR }}"
            exit 1
          fi
          echo "Found binary at: $BIN_PATH"
          BIN_DIR=$(dirname "$BIN_PATH")
          cd "$BIN_DIR"
          chmod +x "${{ env.PROJECT_NAME }}"
          cp "${{ env.PROJECT_NAME }}" "${{ env.PROJECT_NAME }}-Linux"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.name }}
          path: ${{ env.BUILD_DIR }}/**/${{ matrix.artifact_file }}
          if-no-files-found: error

  release:
    if: contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            */*.exe
            */*.dmg
            */*-Linux
